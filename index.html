<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hair Force</title>
<meta name="description" content="Tap to fire the air thrusters. Fly the AEROLUX through the golden towers.">
<meta name="theme-color" content="#2a0f2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --gold:#ffd25e; --gold2:#ff9f2e; --ink:#1b0a1f; --cyan:#5ff4ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#1b0a1f; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; font-family:Inter,system-ui,sans-serif; color:#fff; }
  #score { position:absolute; top:max(18px,env(safe-area-inset-top)); left:0; right:0; text-align:center;
    font-family:Bungee,Impact,sans-serif; font-size:clamp(48px,9vmin,92px); letter-spacing:2px;
    color:#fff; text-shadow:0 4px 0 #c46a12, 0 8px 22px rgba(0,0,0,.45); transition:transform .12s; }
  #score.pop { transform:scale(1.18); }
  #mult { position:absolute; top:calc(max(18px,env(safe-area-inset-top)) + clamp(58px,10vmin,104px)); left:0; right:0; text-align:center;
    font:800 clamp(14px,2.6vmin,22px) Inter,sans-serif; color:#ff4057; letter-spacing:3px; opacity:0; transition:opacity .2s; text-shadow:0 2px 10px rgba(0,0,0,.5); }
  #toast { position:absolute; left:0; right:0; top:34%; text-align:center; font-family:Bungee,sans-serif;
    font-size:clamp(20px,4vmin,40px); color:var(--cyan); opacity:0; transform:translateY(10px); transition:opacity .15s, transform .15s;
    text-shadow:0 3px 0 #0b5560, 0 6px 18px rgba(0,0,0,.5); }
  #toast.on { opacity:1; transform:none; }
  .panel { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    text-align:center; padding:24px 16px; transition:opacity .35s; }
  .panel.hidden { opacity:0; }
  .rec .panel, .rec #toast, .rec #mult, .rec #score { transition:none; }
  .logo { font-family:Bungee,Impact,sans-serif; font-size:clamp(46px,12vmin,132px); line-height:.9; margin:0;
    background:linear-gradient(180deg,#fff6c9 0%,#ffd25e 45%,#ff9f2e 70%,#c45a10 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 0 #5a1d0c) drop-shadow(0 14px 30px rgba(0,0,0,.45)); }
  .sub { font:700 clamp(12px,2.2vmin,16px) Inter,sans-serif; letter-spacing:5px; color:#ffe9b8; opacity:.9; text-transform:uppercase; }
  .cta { margin-top:18px; font-family:Bungee,sans-serif; font-size:clamp(16px,3vmin,26px); color:#fff; padding:14px 26px; border-radius:999px;
    background:rgba(20,6,24,.45); border:2px solid rgba(255,210,94,.75); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.06); border-color:#fff; } }
  .card { background:rgba(20,6,24,.55); border:1px solid rgba(255,210,94,.35); border-radius:22px; padding:22px 34px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .over { font-family:Bungee,sans-serif; font-size:clamp(30px,7vmin,64px); color:#fff; margin:0; text-shadow:0 4px 0 #8a1322; }
  .stats { display:flex; gap:34px; justify-content:center; margin-top:8px; }
  .stat b { display:block; font-family:Bungee,sans-serif; font-size:clamp(28px,6vmin,50px); color:var(--gold); }
  .stat span { font:700 12px Inter,sans-serif; letter-spacing:4px; color:#ffe9b8; opacity:.8; }
  .new { font:800 13px Inter,sans-serif; letter-spacing:4px; color:var(--cyan); }
  #mute { position:absolute; right:max(16px,env(safe-area-inset-right)); bottom:max(16px,env(safe-area-inset-bottom)); pointer-events:auto;
    width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,.35); background:rgba(20,6,24,.4); color:#fff; font-size:18px; cursor:pointer; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#1b0a1f; color:#ffd25e;
    font:800 14px Inter,sans-serif; letter-spacing:6px; z-index:5; transition:opacity .4s; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">LOADING</div>
<div id="hud">
  <div id="score" style="opacity:0">0</div>
  <div id="mult">BONUS ×2</div>
  <div id="toast">CLOSE ONE!</div>
  <div id="title" class="panel">
    <div class="sub">AEROLUX air-thruster hypercar</div>
    <h1 class="logo">HAIR<br>FORCE</h1>
    <div class="sub">Dodge the golden towers</div>
    <div class="cta">TAP · CLICK · SPACE</div>
  </div>
  <div id="gameover" class="panel hidden" style="display:none">
    <div class="card">
      <h2 class="over">BAD HAIR DAY</h2>
      <div class="stats">
        <div class="stat"><b id="final">0</b><span>SCORE</span></div>
        <div class="stat"><b id="best">0</b><span>BEST</span></div>
      </div>
      <div id="newbest" class="new" style="display:none">NEW RECORD</div>
    </div>
    <div class="cta">TAP TO RETRY</div>
  </div>
  <button id="mute" aria-label="Sound">🔊</button>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
